server:
  port: 9200

spring:
  application:
    name: daydayup-auth
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:daydayup-common.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:23336}/${MYSQL_DATABASE:daydayup_auth}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init.sql

daydayup:
  auth:
    # OAuth2/OIDC issuer：必须是「前端与网关都能访问、且对外一致」的地址
    # （决定 OIDC discovery 文档里的端点 URL 与 id_token 的 iss claim）。
    # 开发默认直连本机；容器/生产部署须经环境变量改为对外地址（如经网关：http://your-host/auth）。
    issuer-url: ${DAYDAYUP_AUTH_ISSUER:http://127.0.0.1:9200}
    # OIDC 授权码流程未登录时的入口。默认返回 JSON 401；接独立 auth-ui 时改为前端登录页地址。
    # auth-ui 登录成功后应调用 /api/session/login 建立服务端会话，再回到 /oauth2/authorize。
    oidc-login-url: ${DAYDAYUP_AUTH_OIDC_LOGIN_URL:/api/session/login-required}
    jwk:
      # 私钥加密主密码，生产环境请通过环境变量或 KMS 注入；所有实例必须相同
      master-password: ${JWK_MASTER_PASSWORD:daydayup-jwk-default}
  swagger:
    title: DayDayUP Auth API
    description: 认证中心接口文档
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        # 生产环境仅暴露必要端点；本地调试可通过 Nacos 覆盖为 *
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 仅对已认证用户显示健康详情，避免向匿名请求泄露 DB/Redis 等内部信息
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

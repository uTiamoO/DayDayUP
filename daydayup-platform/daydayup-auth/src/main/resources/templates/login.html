<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayDayUP 登录</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f6f8;
            --panel: #ffffff;
            --text: #172033;
            --muted: #667085;
            --line: #d8dee8;
            --field: #f8fafc;
            --primary: #2364d2;
            --primary-strong: #184da3;
            --success-bg: #ecfdf3;
            --success-text: #027a48;
            --danger-bg: #fff1f2;
            --danger-text: #be123c;
            --warning: #b45309;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            color: var(--text);
            background:
                    linear-gradient(135deg, rgba(35, 100, 210, 0.08), rgba(2, 122, 72, 0.06)),
                    var(--bg);
        }

        .auth-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(360px, 440px);
            align-items: stretch;
        }

        .brand-panel {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 42px;
            padding: 56px;
            background: #101828;
            color: #f8fafc;
        }

        .brand-mark {
            display: inline-flex;
            width: 44px;
            height: 44px;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: #2364d2;
            font-weight: 700;
        }

        .brand-copy {
            max-width: 560px;
        }

        .eyebrow {
            margin: 0 0 16px;
            color: #98a2b3;
            font-size: 14px;
        }

        .brand-copy h1 {
            margin: 0;
            font-size: 40px;
            font-weight: 700;
            line-height: 1.18;
        }

        .brand-copy p {
            margin: 18px 0 0;
            color: #d0d5dd;
            font-size: 16px;
            line-height: 1.7;
        }

        .login-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            box-shadow: 0 18px 42px rgba(16, 24, 40, 0.08);
        }

        .login-card h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            line-height: 1.25;
        }

        .login-subtitle {
            margin: 10px 0 24px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .alert {
            margin-bottom: 18px;
            padding: 11px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.45;
        }

        .alert-error {
            color: var(--danger-text);
            background: var(--danger-bg);
            border: 1px solid #fecdd3;
        }

        .alert-success {
            color: var(--success-text);
            background: var(--success-bg);
            border: 1px solid #abefc6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #344054;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 44px;
            padding: 0 12px;
            color: var(--text);
            background: var(--field);
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(35, 100, 210, 0.14);
        }

        .submit-button {
            width: 100%;
            height: 44px;
            margin-top: 4px;
            color: #ffffff;
            background: var(--primary);
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.16s ease, transform 0.16s ease;
        }

        .submit-button:hover {
            background: var(--primary-strong);
        }

        .submit-button:active {
            transform: translateY(1px);
        }

        .security-note {
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .security-note strong {
            color: var(--warning);
            font-weight: 700;
        }

        @media (max-width: 860px) {
            .auth-shell {
                grid-template-columns: 1fr;
            }

            .brand-panel {
                min-height: 220px;
                padding: 28px;
            }

            .brand-copy h1 {
                font-size: 28px;
            }

            .brand-copy p,
            .brand-mark {
                display: none;
            }

            .login-panel {
                align-items: flex-start;
                padding: 24px 16px;
            }

            .login-card {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
<main class="auth-shell">
    <section class="brand-panel" aria-label="DayDayUP 认证中心">
        <div class="brand-mark">DU</div>
        <div class="brand-copy">
            <p class="eyebrow">DayDayUP Identity</p>
            <h1>统一认证入口</h1>
            <p>进入 DayDayUP 工作区。</p>
        </div>
    </section>

    <section class="login-panel" aria-label="登录表单">
        <div class="login-card">
            <h2>登录 DayDayUP</h2>
            <p class="login-subtitle">使用平台账号进入统一认证中心。</p>

            <div th:if="${param.error}" class="alert alert-error" role="alert" aria-live="polite">
                用户名或密码错误
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="status" aria-live="polite">
                已成功登出
            </div>

            <form method="post" th:action="@{/login}">
                <!--/* CSRF token 由 Spring Security 经 th:action 自动注入；若改用普通 action 需手动补 _csrf 隐藏域 */-->
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text"
                           id="username"
                           name="username"
                           autocomplete="username"
                           required
                           autofocus/>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password"
                           id="password"
                           name="password"
                           autocomplete="current-password"
                           required/>
                </div>
                <button class="submit-button" type="submit">登录</button>
            </form>

            <p class="security-note">
                <strong>提示：</strong>请确认浏览器地址属于可信环境。
            </p>
        </div>
    </section>
</main>
</body>
</html>

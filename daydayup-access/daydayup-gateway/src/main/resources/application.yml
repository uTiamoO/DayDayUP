server:
  port: 9000

spring:
  application:
    name: daydayup-gateway
  config:
    # optional: 让 Nacos 不可达时仅打 WARN 而不是直接启动失败，方便骨架空跑
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:daydayup-common.yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: daydayup-auth
              uri: lb://daydayup-auth
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
            - id: daydayup-admin
              uri: lb://daydayup-admin-biz
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: daydayup-game
              uri: lb://daydayup-game-biz
              predicates:
                - Path=/game/**
              filters:
                - StripPrefix=1
            - id: daydayup-social
              uri: lb://daydayup-social-biz
              predicates:
                - Path=/social/**
              filters:
                - StripPrefix=1
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true

daydayup:
  gateway:
    jwk-set-uri: ${JWK_SET_URI:http://127.0.0.1:9200/oauth2/jwks}
    permit-paths:
      # 仅放行真正无需登录态的端点：令牌、公钥、OIDC 发现、文档、健康检查
      # 注：刷新令牌走 POST /auth/oauth2/token (grant_type=refresh_token)，SAS 无独立 refresh 端点
      - /auth/oauth2/token
      - /auth/oauth2/jwks
      - /auth/.well-known/openid-configuration
      - /*/v3/api-docs/**
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        # 生产环境仅暴露必要端点；本地调试可通过 Nacos 覆盖为 *
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: info

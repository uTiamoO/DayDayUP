server:
  port: 9000

spring:
  application:
    name: daydayup-gateway
  config:
    # optional: 让 Nacos 不可达时仅打 WARN 而不是直接启动失败，方便骨架空跑
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:daydayup-common.yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          routes:
            - id: daydayup-auth-oauth2
              uri: lb://daydayup-auth
              predicates:
                - Path=/auth/oauth2/**
              filters:
                - StripPrefix=1
            - id: daydayup-auth-well-known
              uri: lb://daydayup-auth
              predicates:
                - Path=/auth/.well-known/**
              filters:
                - StripPrefix=1
            - id: daydayup-auth-userinfo
              uri: lb://daydayup-auth
              predicates:
                - Path=/auth/userinfo
              filters:
                - StripPrefix=1
            - id: daydayup-auth-login-api
              uri: lb://daydayup-auth
              predicates:
                - Path=/auth/login,/auth/refresh,/auth/logout,/auth/session/**
              filters:
                - RewritePath=/auth/(?<segment>.*), /api/$\{segment}
            # 说明：auth 的 /api/{users,roles,permissions} 不经网关对外暴露。
            # 这些端点没有方法级鉴权，一旦公开，任意已登录用户即可越权管理 RBAC。
            # 管理入口统一走 /admin/**（admin-biz 门面，带 @PreAuthorize）；
            # auth 的管理 API 仅供服务间 Feign 内部调用。
            - id: daydayup-admin
              uri: lb://daydayup-admin-biz
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=1
            - id: daydayup-reading
              uri: lb://daydayup-reading-biz
              predicates:
                - Path=/reading/**
              filters:
                - StripPrefix=1
            - id: daydayup-game
              uri: lb://daydayup-game-biz
              predicates:
                - Path=/game/**
              filters:
                - StripPrefix=1
            - id: daydayup-social
              uri: lb://daydayup-social-biz
              predicates:
                - Path=/social/**
              filters:
                - StripPrefix=1
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: true

daydayup:
  gateway:
    # 网关验签：直连 auth 服务（内部调用不走网关）
    jwk-set-uri: ${JWK_SET_URI:http://127.0.0.1:9200/oauth2/jwks}
    permit-paths:
      # 仅放行真正无需登录态的端点：令牌、公钥、OIDC 发现、文档、健康检查
      - /auth/oauth2/token
      - /auth/oauth2/jwks
      - /auth/.well-known/openid-configuration
      - /auth/login
      - /auth/refresh
      - /auth/logout
      - /auth/session/login-required
      - /auth/session/login
      - /*/v3/api-docs/**
      - /actuator/health

management:
  endpoints:
    web:
      exposure:
        # 生产环境仅暴露必要端点；本地调试可通过 Nacos 覆盖为 *
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

logging:
  level:
    org.springframework.cloud.gateway: info

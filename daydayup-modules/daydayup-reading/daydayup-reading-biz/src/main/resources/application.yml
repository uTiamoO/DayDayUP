server:
  port: 9600

spring:
  application:
    name: daydayup-reading-biz
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml
      - optional:nacos:daydayup-common.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_HOST:127.0.0.1}:${NACOS_PORT:8848}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:23336}/${MYSQL_DATABASE:daydayup_reading}?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:26379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0

# 阅读中台专属配置
reading:
  source:
    # 书源导入默认目录（相对进程工作目录），可被 /ops/sources/import?dir= 覆盖
    import-dir: ${READING_SOURCE_IMPORT_DIR:docs/书源/spike-samples}
    maoyan:
      # 敏感 Header 只允许通过部署环境注入；默认空值不会发送。
      authorization: ${READING_MAOYAN_AUTHORIZATION:}
      client-device: ${READING_MAOYAN_CLIENT_DEVICE:}
      client-brand: ${READING_MAOYAN_CLIENT_BRAND:}
      client-version: ${READING_MAOYAN_CLIENT_VERSION:2.3.0}
      client-channel: ${READING_MAOYAN_CLIENT_CHANNEL:android}
      client-name: ${READING_MAOYAN_CLIENT_NAME:app.maoyankanshu.novel}
      client-source: ${READING_MAOYAN_CLIENT_SOURCE:android}
      alias-name: ${READING_MAOYAN_ALIAS_NAME:maoyankanshu}
  http:
    connect-timeout-ms: 5000
    read-timeout-ms: 10000
    max-redirects: 5
    # SSRF 防护：生产必须 false；仅本机联调置 true
    allow-private: ${READING_HTTP_ALLOW_PRIVATE:false}
    # 书源未声明 concurrentRate 时的默认最小请求间隔（毫秒）
    default-min-interval-ms: 200
    max-concurrent-per-source: 2
    rate-wait-timeout-ms: 10000
    # 出站代理（翻墙）：访问被墙/被 Cloudflare 拦的源站时开启。开启后本地 DNS+私网 IP 校验跳过，
    # 由代理负责连通与远程 DNS（SOCKS）；同域校验仍生效。本机 Clash 常见 7890，V2rayN HTTP 常见 10809。
    proxy:
      enabled: ${READING_HTTP_PROXY_ENABLED:false}
      type: ${READING_HTTP_PROXY_TYPE:HTTP}
      host: ${READING_HTTP_PROXY_HOST:127.0.0.1}
      port: ${READING_HTTP_PROXY_PORT:7890}
  script:
    # GraalJS 单脚本执行超时（看门狗 Context.interrupt）与语句数上限（双保险）
    timeout-ms: 3000
    statement-limit: 2000000
  task:
    # 自动 worker 默认关闭，避免本地启动后意外抓取；可通过内网 /ops/tasks/drain 手动验证
    worker-enabled: ${READING_TASK_WORKER_ENABLED:false}
    worker-interval-ms: ${READING_TASK_WORKER_INTERVAL_MS:5000}
    lock-timeout-ms: ${READING_TASK_LOCK_TIMEOUT_MS:300000}
    default-max-retry: ${READING_TASK_DEFAULT_MAX_RETRY:3}
    retry-backoff-ms: ${READING_TASK_RETRY_BACKOFF_MS:30000}
    batch-size: ${READING_TASK_BATCH_SIZE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${TRACE_SAMPLING:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://127.0.0.1:9411/api/v2/spans}

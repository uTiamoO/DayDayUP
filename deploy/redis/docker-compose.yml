services:
  redis:
    image: redis:7-alpine
    container_name: daydayup-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-26379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_akQSwr}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - ./data:/data
    networks:
      - daydayup

networks:
  daydayup:
    driver: bridge

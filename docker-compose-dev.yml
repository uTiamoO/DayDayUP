# ============================================================
# DayDayUP 本地开发环境一键启动
# 用法: docker compose -f docker-compose-dev.yml up -d
# ============================================================

services:
  # ========== 基础设施 ==========

  mysql:
    image: mysql:8.3
    container_name: dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-23336}:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
    networks:
      - daydayup

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-26379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_akQSwr}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - daydayup

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: dev-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos
      MYSQL_SERVICE_USER: root
      MYSQL_SERVICE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=2000&socketTimeout=5000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-SecretKey012345678901234567890123456789012345678901234567890123456789}
      NACOS_AUTH_IDENTITY_KEY: serverIdentity
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY:-security}
      JVM_XMS: 256m
      JVM_XMX: 512m
      TZ: Asia/Shanghai
    ports:
      - "18848:8848"
      - "19848:9848"
    depends_on:
      - mysql
    volumes:
      - nacos-logs:/home/nacos/logs
    networks:
      - daydayup

  # ========== 可选服务（docker compose --profile full up） ==========

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: dev-rocketmq-namesrv
    restart: unless-stopped
    profiles:
      - full
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
      TZ: Asia/Shanghai
    volumes:
      - rocketmq-namesrv-logs:/home/rocketmq/logs
    networks:
      - daydayup

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: dev-rocketmq-broker
    restart: unless-stopped
    profiles:
      - full
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-controller
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx512m"
      TZ: Asia/Shanghai
    depends_on:
      - rocketmq-namesrv
    volumes:
      - rocketmq-broker-logs:/home/rocketmq/logs
      - rocketmq-broker-store:/home/rocketmq/store
    networks:
      - daydayup

  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: dev-xxl-job-admin
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "9400:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/xxl_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      XXL_JOB_LOGIN_USERNAME: admin
      XXL_JOB_LOGIN_PASSWORD: 123456
      TZ: Asia/Shanghai
    depends_on:
      - mysql
    networks:
      - daydayup

volumes:
  mysql-data:
  redis-data:
  nacos-logs:
  rocketmq-namesrv-logs:
  rocketmq-broker-logs:
  rocketmq-broker-store:

networks:
  daydayup:
    driver: bridge
